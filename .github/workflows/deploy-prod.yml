# Builds the web demo image whenever `prod` moves, publishes it to GHCR, and
# asks the server to pull it.
#
# The runner never logs into the server. It builds the image here — the host
# that serves lexiroot.viii.me is too small to compile Rust comfortably — pushes
# to ghcr.io, then makes one signed HTTPS request to a webhook receiver on the
# host, which runs deploy/deploy.sh there. No SSH, no inbound shell, and no
# credential in this repo that could open one.
#
# The request is deliberately sent *after* the image push succeeds, which is why
# this is a curl from the workflow rather than a repository webhook on `push`:
# a repository webhook fires the moment you push, while the image is still
# building, and the server would pull the previous one.
#
# Required repository secrets:
#   DEPLOY_WEBHOOK_URL     e.g. https://lexiroot.viii.me/hooks/deploy
#   DEPLOY_WEBHOOK_SECRET  shared with /etc/lexiroot/hooks.json on the server
#
# Optional repository secrets:
#   SERVERCHAN_SENDKEY  Server酱 sendkey; the notify job below is skipped without it
#
# Optional repository variables:
#   DEPLOY_IMAGE  image name; defaults to ghcr.io/<owner>/<repo>
#
# Server-side setup lives in deploy/README.md.

name: Deploy prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

# Never let two deploys race for the same container.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# `packages: write` is what lets GITHUB_TOKEN push to GHCR, so no personal
# access token is involved on either end.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.DEPLOY_IMAGE || format('ghcr.io/{0}', github.repository) }}

    steps:
      # Without this the run dies inside curl with an empty URL, which reads
      # like a network problem rather than a missing secret.
      - name: Check required secrets
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$WEBHOOK_URL" ] || missing+=(DEPLOY_WEBHOOK_URL)
          [ -n "$WEBHOOK_SECRET" ] || missing+=(DEPLOY_WEBHOOK_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Set them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: `prod` is what the server pulls, `sha-<commit>` is a permanent
      # handle for pinning an older build by hand when a rollback needs to
      # outlive the one generation deploy.sh keeps on disk.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The receiver verifies this signature before running anything, in the
      # same scheme GitHub itself uses for webhooks (HMAC-SHA256 over the body).
      #
      # No --retry: the receiver blocks until the deploy finishes, so a timeout
      # here does not mean the deploy failed, and retrying could start a second
      # one. Re-run the workflow by hand if a request genuinely gets lost.
      - name: Ask the server to pull
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          body="$(jq -nc --arg revision "$GITHUB_SHA" '{revision: $revision}')"
          signature="$(printf '%s' "$body" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r \
            | cut -d ' ' -f 1)"
          curl -fsS --max-time 300 \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data "$body" \
            "$WEBHOOK_URL"

  # Separate job rather than a step, so it also reports the cases that kill the
  # deploy job outright — a missing secret, a cancelled run, a runner that dies
  # mid-build — instead of only the failures that happen to leave later steps
  # runnable.
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Push the result to Server酱
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RESULT: ${{ needs.deploy.result }}
          # Untrusted text (anyone's commit message). It goes through the
          # environment so the shell never sees it as code. Empty on
          # workflow_dispatch, which carries no head commit.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$SENDKEY" ]; then
            echo "::warning::SERVERCHAN_SENDKEY is not set; skipping the deploy notification."
            exit 0
          fi

          case "$RESULT" in
            success) title="✅ LexiRoot 部署成功" ;;
            cancelled) title="⚠️ LexiRoot 部署已取消" ;;
            *) title="❌ LexiRoot 部署失败" ;;
          esac

          # Server酱 renders `desp` as Markdown; the blank lines are what keep
          # the list from collapsing into one paragraph.
          desp="$(jq -nr \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg result "$RESULT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg message "${COMMIT_MESSAGE:-（手动触发）}" \
            --arg url "$RUN_URL" \
            '"- 仓库：\($repo)\n- 提交：`\($sha)`\n- 提交信息：\($message | split("\n")[0])\n- 触发者：\($actor)\n- 结果：**\($result)**\n\n[查看运行日志](\($url))"')"

          response="$(curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg title "$title" --arg desp "$desp" '{title: $title, desp: $desp}')" \
            "https://sctapi.ftqq.com/${SENDKEY}.send")"

          # Server酱 answers 200 with a non-zero `code` for a revoked or
          # rate-limited key, so the HTTP status alone would report a delivered
          # message that nobody received.
          if [ "$(jq -r '.code' <<<"$response")" != "0" ]; then
            echo "::error::Server酱 rejected the notification: $response"
            exit 1
          fi
          echo "Notified: ${title}"
