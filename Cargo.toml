[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/analyzer",
    "crates/cli",
    "crates/pipeline/importer",
    "crates/pipeline/exporter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lexiroot/lexiroot"

[workspace.dependencies]
lexiroot-core = { path = "crates/core" }
lexiroot-analyzer = { path = "crates/analyzer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
