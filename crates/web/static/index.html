<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexiRoot · 分词测试台</title>
<style>
  :root {
    --bg: #f8f8f6;
    --surface: #ffffff;
    --border: #e4e4df;
    --text: #242521;
    --muted: #777970;
    --accent: #a15e38;
    --prefix: #2f6f8f;
    --root: #a15e38;
    --suffix: #4a7a45;
    --chip: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181917;
      --surface: #21221f;
      --border: #363832;
      --text: #edede8;
      --muted: #a1a49b;
      --accent: #d99a63;
      --prefix: #79b6d4;
      --root: #d99a63;
      --suffix: #8fc189;
      --chip: #2b2d29;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; }
  .head { text-align: center; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.04em; }
  h1 span { color: var(--accent); }
  .repo {
    display: inline-flex; align-items: center; gap: 0.35rem;
    margin-top: 0.7rem; color: var(--muted); font-size: 0.8rem; text-decoration: none;
  }
  .repo:hover { color: var(--accent); }
  .sub { max-width: 34rem; margin: 0.65rem auto 0; color: var(--muted); font-size: 0.9rem; }
  .notice {
    margin: 0.4rem 0 2rem; color: var(--muted); font-size: 0.75rem; text-align: center;
  }

  .modes { display: flex; justify-content: center; gap: 0.35rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .modes button {
    padding: 0.35rem 0.75rem; border: 1px solid transparent; border-radius: 999px;
    background: var(--surface); color: var(--muted); font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .modes button:hover { color: var(--accent); }
  .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  form { display: flex; max-width: 540px; margin: 0 auto; gap: 0.5rem; }
  input {
    flex: 1; min-width: 0; padding: 0.7rem 0.9rem; font: inherit; text-align: center;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button {
    padding: 0.7rem 1.25rem; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; cursor: pointer;
  }

  .examples { justify-content: center; margin-top: 0.7rem; display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
  .examples span { color: var(--muted); font-size: 0.8rem; }
  .chip {
    padding: 0.18rem 0.55rem; border: 1px solid var(--border); border-radius: 999px;
    background: var(--chip); color: var(--text); font: inherit; font-size: 0.8rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    margin-top: 2.25rem; padding: 1.5rem 1.25rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; text-align: center;
  }
  .card h2 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.8rem; margin: 0.25rem 0; }
  .meta code { font-size: 0.8rem; }

  .segments { display: flex; justify-content: center; align-items: flex-start; max-width: 100%; overflow-x: auto; gap: 0.2rem; margin: 1.35rem auto 1rem; padding: 0 0.25rem 0.25rem; scrollbar-width: thin; }
  .seg { display: inline-flex; flex: 0 0 auto; flex-direction: column; align-items: center; min-width: 4.5rem; padding: 0 0.35rem; }
  .seg .kind { font-size: 0.65rem; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.05em; }
  .seg .form { font-size: 1.25rem; line-height: 1.3; font-weight: 650; margin: 0.1rem 0 0.12rem; }
  .seg .meaning { max-width: 9rem; color: var(--muted); font-size: 0.78rem; line-height: 1.4; }
  .seg.prefix .kind { color: var(--prefix); }
  .seg.root .kind { color: var(--root); }
  .seg.suffix .kind { color: var(--suffix); }
  .dot { flex: 0 0 auto; padding: 1.2rem 0.05rem 0; color: var(--muted); font-size: 1.1rem; line-height: 1.3; }

  .evidence {
    max-width: 38rem; margin: 1.1rem auto 0; padding-top: 0.8rem; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.78rem;
  }
  .list { justify-content: center; display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  ul.meanings { max-width: 32rem; margin: 0.35rem auto 1rem; padding: 0; list-style: none; color: var(--muted); }
  .empty, .error { color: var(--muted); }
  .error { color: #c0522d; }
  @media (prefers-color-scheme: dark) { .error { color: #e58b62; } }
  @media (max-width: 480px) {
    body { padding-top: 2.5rem; }
    .card { padding-inline: 0.75rem; }
    .seg { min-width: 3.9rem; }
    .seg .meaning { max-width: 7.5rem; }
  }
</style>
<!-- Self-hosted GoatCounter. It records the pageview by itself and skips
     localhost unless `allow_local` is set, so a `cargo run` counts nothing;
     the queries below are sent as events on top of that pageview. -->
<script id="goatcounter" data-goatcounter="https://lexiroot.stats.viii.me/count"
        async src="https://lexiroot.stats.viii.me/count.js"></script>
</head>
<body>
<main>
  <div class="head">
    <h1>Lexi<span>Root</span></h1>
    <a class="repo" href="https://github.com/tcyeee/lexiroot" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      GitHub
    </a>
  </div>
  <p class="sub">形态分析测试台 — 直接调用 analyzer，与 CLI 走同一条查询路径。</p>
  <p class="notice">本页面仅用于该组件的边界测试，不是正式产品页面。</p>

  <div class="modes" id="modes">
    <button data-mode="analyze" aria-pressed="true">分析单词</button>
    <button data-mode="root" aria-pressed="false">查词根</button>
    <button data-mode="family" aria-pressed="false">同根词族</button>
  </div>

  <form id="form">
    <input id="input" aria-label="查询内容" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="inspection">
    <button type="submit">查询</button>
  </form>

  <div class="examples" id="examples"><span>示例：</span></div>

  <div id="out"></div>
</main>

<script>
const EXAMPLES = {
  analyze: ["inspection", "transportation", "predictable", "unbelievable"],
  root: ["spect", "port", "dict"],
  family: ["spect", "port", "act"],
};
const PARAM = { analyze: "word", root: "text", family: "text" };
const KIND_LABEL = { prefix: "前缀 Prefix", root: "词根 Root", suffix: "后缀 Suffix" };

let mode = "analyze";
const $ = (id) => document.getElementById(id);
const out = $("out");

/**
 * One GoatCounter event, e.g. `query/analyze`. Event names are drawn from a
 * fixed vocabulary — the mode and the HTTP status — never from the search box,
 * so what gets counted is how often each mode is used, not what was typed.
 *
 * Silently does nothing when count.js never loaded — blocked, offline, or
 * running on localhost — because analytics must never be able to break the
 * page it measures.
 *
 * count.js is async, so a query fired from the URL on first paint can beat it
 * to the punch. That is exactly the shared-link case worth measuring, so the
 * event waits for the script's load event instead of being dropped.
 */
function track(path) {
  const send = () => {
    try {
      window.goatcounter?.count?.({ path, event: true });
    } catch (_) { /* ignore */ }
  };
  if (window.goatcounter?.count) send();
  else $("goatcounter")?.addEventListener("load", send, { once: true });
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function card() {
  out.replaceChildren();
  const node = el("div", "card");
  out.append(node);
  return node;
}

function setMode(next) {
  mode = next;
  for (const button of $("modes").children) {
    button.setAttribute("aria-pressed", String(button.dataset.mode === next));
  }
  $("input").placeholder = EXAMPLES[next][0];
  renderExamples();
}

function renderExamples() {
  const box = $("examples");
  box.replaceChildren(el("span", null, "示例："));
  for (const word of EXAMPLES[mode]) {
    const chip = el("button", "chip", word);
    chip.type = "button";
    chip.onclick = () => run(word);
    box.append(chip);
  }
}

function meaningText(morpheme) {
  return morpheme.meanings.length ? morpheme.meanings.join("、") : "（无记录义项）";
}

function metaLine(data) {
  return `置信度 ${data.confidence.toFixed(2)}`;
}

function segmentsNode(segments) {
  const box = el("div", "segments");
  if (!segments.length) {
    box.append(el("p", "empty", "（无可解析的语素）"));
    return box;
  }
  segments.forEach((segment, index) => {
    // `role` is the slot this morpheme fills in this word; `positions` (also
    // on the payload) is every slot the form is attested in.
    if (index > 0) box.append(el("span", "dot", "·"));
    const seg = el("span", `seg ${segment.role}`);
    seg.append(
      el("span", "kind", KIND_LABEL[segment.role] ?? segment.role),
      el("span", "form", segment.form),
      el("span", "meaning", meaningText(segment)),
    );
    box.append(seg);
  });
  return box;
}

function wordChips(words, nextMode) {
  const box = el("div", "list");
  for (const word of words) {
    const chip = el("button", "chip", word);
    chip.type = "button";
    chip.onclick = () => { setMode(nextMode); $("input").value = word; run(word); };
    box.append(chip);
  }
  return box;
}

function renderAnalyze(data) {
  const node = card();
  node.append(
    el("h2", null, data.word),
    el("p", "meta", metaLine(data)),
    segmentsNode(data.segments),
    el("p", "evidence", `依据：${data.evidence}`),
  );
}

function renderRoot(data) {
  const node = card();
  node.append(
    el("h2", null, data.morpheme.form),
    el("p", "meta", metaLine(data)),
    el("div", "label", "义项"),
  );
  const list = el("ul", "meanings");
  const meanings = data.morpheme.meanings.length ? data.morpheme.meanings : ["（无记录义项）"];
  for (const meaning of meanings) list.append(el("li", null, meaning));
  node.append(list, el("div", "label", `相关词（${data.related_words.length}）`));
  node.append(
    data.related_words.length
      ? wordChips(data.related_words, "analyze")
      : el("p", "empty", "本数据集中暂无收录词。"),
  );
  node.append(el("p", "evidence", `依据：${data.evidence}`));
}

function renderFamily(data) {
  const node = card();
  node.append(el("h2", null, data.root), el("p", "meta", `共 ${data.words.length} 个同根词`));
  node.append(
    data.words.length
      ? wordChips(data.words.map((word) => word.word), "analyze")
      : el("p", "empty", "本数据集中暂无该词根的同根词。"),
  );
}

function renderError(message) {
  card().append(el("p", "error", message));
}

/** Keeps the URL in sync so any query can be linked or reloaded. */
function syncUrl(value) {
  const url = new URL(location.href);
  url.searchParams.set("mode", mode);
  url.searchParams.set("q", value);
  history.replaceState(null, "", url);
}

async function run(rawValue) {
  const value = (rawValue ?? $("input").value).trim();
  if (!value) return;
  $("input").value = value;
  syncUrl(value);

  const current = mode;
  track(`query/${current}`);
  card().append(el("p", "empty", "查询中…"));
  try {
    const response = await fetch(`/api/${current}?${PARAM[current]}=${encodeURIComponent(value)}`);
    const data = await response.json();
    if (!response.ok) {
      // Counted by status rather than by message: a miss (404) and a broken
      // server (5xx) are the two cases worth telling apart afterwards.
      track(`miss/${current}/${response.status}`);
      renderError(data.error ?? `请求失败（${response.status}）`);
      return;
    }
    if (current === "analyze") renderAnalyze(data);
    else if (current === "root") renderRoot(data);
    else renderFamily(data);
  } catch (error) {
    track(`miss/${current}/network`);
    renderError(`请求失败：${error}`);
  }
}

$("modes").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-mode]");
  if (!button) return;
  setMode(button.dataset.mode);
  if ($("input").value.trim()) run();
});
$("form").addEventListener("submit", (event) => { event.preventDefault(); run(); });

const initial = new URLSearchParams(location.search);
const initialMode = initial.get("mode");
setMode(EXAMPLES[initialMode] ? initialMode : "analyze");
if (initial.get("q")) run(initial.get("q"));
</script>
</body>
</html>
